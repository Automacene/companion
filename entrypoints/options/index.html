<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automacene Settings</title>
  </head>
  <body class="settings-body">
    
    <!-- Hairline Background Overlay -->
    <div class="settings-container">
      <div id="grid-overlay"></div>
      
      <main class="settings-main-wrapper">
        
        <!-- Header -->
        <header class="settings-header">
          <div class="header-title-group">
            <div>
              <h1 class="settings-title"><span id="status-dot" class="status-indicator-dot"></span> COMPANION SETTINGS</h1>
              <p class="settings-subtitle">Extension Configuration & LLM Options</p>
            </div>
          </div>
          <span id="status-pill" class="status-badge">
            [ CHECKING... ]
          </span>
        </header>

        <form id="settings-form" class="settings-form">
          
          <!-- 2-Column Responsive Grid Layout -->
          <div class="settings-grid">
            
            <!-- LEFT COLUMN -->
            <div class="grid-column">
              
              <!-- Section 1: Server & Connection -->
              <section class="settings-card">
                <h2 class="card-section-title">1. Server & Connection</h2>
                
                <div class="form-group">
                  <label for="ollama-host" class="form-label">Ollama Host URL</label>
                  <div class="input-action-row">
                    <input 
                      id="ollama-host" 
                      type="text" 
                      class="form-input code-font input-flex-grow"
                      placeholder="http://localhost:11434"
                    />
                    <button 
                      id="test-conn-btn" 
                      type="button" 
                      class="btn-secondary code-font"
                    >
                      Test Connection
                    </button>
                  </div>
                </div>

                <div class="form-row-2col">
                  <div class="form-group">
                    <label for="conn-timeout" class="form-label">Connection Timeout (ms)</label>
                    <input 
                      id="conn-timeout" 
                      type="number" 
                      class="form-input code-font"
                    />
                  </div>
                  <div class="form-group">
                    <label for="keep-alive" class="form-label">VRAM Keep Alive</label>
                    <input 
                      id="keep-alive" 
                      type="text" 
                      placeholder="5m, 15m, -1"
                      class="form-input code-font"
                    />
                  </div>
                </div>
              </section>

              <!-- Section 2: Model & Prompts -->
              <section class="settings-card">
                <h2 class="card-section-title">2. Model & Assistant Rules</h2>
                
                <div class="form-row-2col">
                  <div class="form-group">
                    <label for="active-model" class="form-label">Primary Model</label>
                    <select id="active-model" class="form-input code-font">
                      <option value="llama3">llama3 (Default)</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label for="fallback-model" class="form-label">Fallback Model</label>
                    <select id="fallback-model" class="form-input code-font">
                      <option value="mistral">mistral</option>
                      <option value="phi3">phi3</option>
                      <option value="">None</option>
                    </select>
                  </div>
                </div>

                <div class="form-group">
                  <label for="system-prompt" class="form-label">System Prompt</label>
                  <textarea 
                    id="system-prompt" 
                    rows="3" 
                    class="form-input textarea-input"
                  ></textarea>
                </div>

                <div class="toggle-row">
                  <span class="form-label">Stream Token Responses</span>
                  <input id="stream-responses" type="checkbox" class="form-checkbox" />
                </div>
              </section>

            </div>

            <!-- RIGHT COLUMN -->
            <div class="grid-column">

              <!-- Section 3: Model Hyperparameters -->
              <section class="settings-card">
                <h2 class="card-section-title">3. Hyperparameters</h2>
                
                <div class="form-group">
                  <div class="range-label-row">
                    <label for="temperature" class="form-label">Temperature</label>
                    <span id="temp-val" class="range-val-text">0.7</span>
                  </div>
                  <input id="temperature" type="range" min="0" max="1" step="0.05" class="form-range" />
                </div>

                <div class="form-row-2col">
                  <div class="form-group">
                    <label for="num-ctx" class="form-label">Context Length (<code>num_ctx</code>)</label>
                    <input id="num-ctx" type="number" class="form-input code-font" />
                  </div>
                  <div class="form-group">
                    <label for="num-predict" class="form-label">Max Predict Tokens (<code>num_predict</code>)</label>
                    <input id="num-predict" type="number" class="form-input code-font" />
                  </div>
                </div>

                <div class="form-row-3col">
                  <div class="form-group">
                    <label for="top-p" class="form-label">Top-P</label>
                    <input id="top-p" type="number" step="0.05" class="form-input code-font" />
                  </div>
                  <div class="form-group">
                    <label for="top-k" class="form-label">Top-K</label>
                    <input id="top-k" type="number" class="form-input code-font" />
                  </div>
                  <div class="form-group">
                    <label for="repeat-penalty" class="form-label">Repeat Penalty</label>
                    <input id="repeat-penalty" type="number" step="0.05" class="form-input code-font" />
                  </div>
                </div>
              </section>

              <!-- Section 4: Memory & Developer Options -->
              <section class="settings-card">
                <h2 class="card-section-title">4. Memory & Developer</h2>
                
                <div class="form-group">
                  <label for="max-memory" class="form-label">Max Character Memory Budget</label>
                  <input id="max-memory" type="number" class="form-input code-font" />
                </div>

                <div class="form-group">
                  <label for="stop-seq" class="form-label">Custom Stop Sequences (Comma separated)</label>
                  <input id="stop-seq" type="text" placeholder="e.g. USER:, END" class="form-input code-font" />
                </div>

                <div class="toggle-row">
                  <span class="form-label">Raw Mode</span>
                  <input id="raw-mode" type="checkbox" class="form-checkbox" />
                </div>

                <div class="toggle-row">
                  <span class="form-label">Debug Console Logging</span>
                  <input id="debug-mode" type="checkbox" class="form-checkbox" />
                </div>
              </section>

            </div>

          </div>

          <!-- Footer Save Controls -->
          <div class="settings-footer">
            <span id="save-toast" class="save-toast-msg">
              ✓ Settings saved successfully
            </span>
            <div class="action-buttons-group" style="gap: 0.75rem;">
              <button id="reset-settings-btn" type="button" class="btn-secondary">
                Reset Defaults
              </button>
              <button type="submit" class="btn-primary">
                Save Settings
              </button>
            </div>
          </div>

        </form>
      </main>
    </div>

    <script type="module" src="main.ts"></script>
  </body>
</html>
