<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automacene Companion</title>
  </head>
  <body>
    <div class="sidepanel ac-backdrop">
      <div id="backdrop-layer" class="ac-backdrop__layer"></div>

      <div class="sidepanel__content ac-backdrop__content">
        <!-- Status header -->
        <header class="sidepanel__header">
          <div class="sidepanel__header-title">
            <div class="sidepanel__header-line">
              <span id="status-dot" class="ac-status-dot"></span>
              <span class="ac-heading">AUTOMACENE COMPANION</span>
            </div>

            <!--
              Which conversation this tab is having.

              Kept in the header rather than in the composer placeholder: a
              placeholder disappears on the first keystroke, which is exactly
              when you are committing a thought to a particular conversation.
              Recognising a tab after a restart cannot be made reliable, so
              this is what makes a wrong guess visible in a glance.

              A button because it renames on click. Naming a conversation
              belongs where you are having it, not on a settings page you would
              have to know to visit.
            -->
            <button
              id="conversation-name"
              type="button"
              class="sidepanel__conversation"
              title="Click to rename this conversation"
            ></button>
          </div>
          <div class="sidepanel__header-actions">
            <span id="status-pill" class="ac-badge">[ CHECKING... ]</span>
            <!-- The only route to either settings page from the main surface. -->
            <button
              id="appearance-btn"
              type="button"
              class="ac-btn ac-btn--icon"
              title="Appearance"
              aria-label="Open appearance settings"
            >◐</button>
            <button
              id="settings-btn"
              type="button"
              class="ac-btn ac-btn--icon"
              title="Model settings"
              aria-label="Open model settings"
            >⚙</button>
          </div>
        </header>

        <!-- Brand hero, collapses once a conversation starts -->
        <section class="sidepanel__hero">
          <!-- Replaced by lib/logo.ts with the live, themed mark. -->
          <div class="sidepanel__logo"></div>
          <div>
            <h1 class="ac-heading ac-heading--hero sidepanel__hero-heading">
              Power <span class="ac-text-accent">your</span> agents with
              <span class="ac-text-accent">your data</span>
            </h1>
            <p class="sidepanel__hero-subtext">
              A <b>data companion</b> for all of your online activities
            </p>
          </div>
        </section>

        <!-- Conversation -->
        <div id="chat-container" class="ac-message-list sidepanel__messages"></div>

        <!-- Composer -->
        <form id="chat-form" class="ac-card ac-card--glass ac-card--flush sidepanel__composer">
          <label class="ac-visually-hidden" for="chat-input">Message</label>
          <textarea
            id="chat-input"
            rows="1"
            placeholder="What is the context of this page?"
            class="ac-input ac-input--bare ac-input--textarea"
            autocomplete="off"
          ></textarea>

          <div class="ac-card__footer">
            <div id="action-row" class="sidepanel__actions">
              <button id="scrape-btn" type="button" class="ac-btn ac-btn--secondary ac-btn--sm">
                Scrape
              </button>
              <button id="map-btn" type="button" class="ac-btn ac-btn--secondary ac-btn--sm" disabled>
                Map
              </button>

              <!--
                Quiet, always present, always in the same place. It says when
                this page was last read and, after a scrape, how much of it was
                already stored. Predictable enough to build a habit on, which a
                popup would not be.
              -->
              <span id="page-status" class="sidepanel__page-status"></span>

              <button
                id="detach-btn"
                type="button"
                class="ac-btn ac-btn--ghost ac-btn--sm sidepanel__detach"
                hidden
              >
                Remove page
              </button>
            </div>
            <button id="run-btn" type="submit" class="ac-btn ac-btn--primary">Run →</button>
          </div>
        </form>
      </div>

      <!-- Footer -->
      <footer class="sidepanel__footer ac-backdrop__content">
        <a
          href="https://github.com/automacene"
          target="_blank"
          rel="noopener noreferrer"
          class="sidepanel__repo-link"
        >
          <svg class="sidepanel__repo-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>Automacene</span>
        </a>
      </footer>
    </div>

    <script type="module" src="main.ts"></script>
  </body>
</html>
